<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>アクセス確認</title>
  <style>
    :root { --red:#dc000c; --ink:#333; --sub:#707070; --line:#e5e5e5; --soft:#f7f7f5; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      color: var(--ink); background: var(--soft);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px;
    }
    .bar { position: fixed; top: 0; left: 0; right: 0; height: 4px; background: var(--red); }
    .card {
      width: 100%; max-width: 360px; background: #fff;
      border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px;
      box-shadow: 0 1px 3px rgba(0,0,0,.05); text-align: center;
    }
    .lock {
      width: 46px; height: 46px; border-radius: 12px; background: var(--soft);
      border: 1px solid var(--line); margin: 0 auto 14px;
      display: flex; align-items: center; justify-content: center; font-size: 22px;
    }
    .corp { font-size: 11px; color: var(--sub); letter-spacing: .08em; }
    h1 { font-size: 16px; margin: 4px 0 2px; }
    .desc { font-size: 12px; color: var(--sub); margin: 0 0 18px; line-height: 1.7; }
    label { display: block; text-align: left; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
    input {
      width: 100%; padding: 10px 12px; font-size: 15px;
      border: 1px solid #ccc; border-radius: 9px; outline: none;
    }
    input:focus { border-color: var(--red); box-shadow: 0 0 0 1px var(--red); }
    button {
      width: 100%; margin-top: 14px; padding: 11px; font-size: 14px; font-weight: 700;
      color: #fff; background: #323232; border: 0; border-radius: 9px; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .err { margin-top: 12px; font-size: 12px; color: var(--red); min-height: 16px; }
    footer { margin-top: 20px; font-size: 11px; color: var(--sub); letter-spacing: .06em; }
  </style>
</head>
<body>
  <div class="bar"></div>
  <div class="card">
    <div class="lock">🔒</div>
    <div class="corp">生産・調達統括本部</div>
    <h1>アクセス確認</h1>
    <p class="desc">社内アクセスコードを入力してください。<br />コードは管理者にお問い合わせください。</p>
    <form id="f">
      <label for="code">アクセスコード</label>
      <input id="code" name="code" type="password" autocomplete="off" autofocus />
      <button id="btn" type="submit">確認</button>
      <div class="err" id="err"></div>
    </form>
    <footer>社内限定ポータル</footer>
  </div>
  <script>
    const f = document.getElementById("f");
    const btn = document.getElementById("btn");
    const err = document.getElementById("err");
    f.addEventListener("submit", async (e) => {
      e.preventDefault();
      err.textContent = "";
      btn.disabled = true;
      try {
        const code = document.getElementById("code").value;
        const r = await fetch("/api/gate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code }),
        });
        if (r.ok) {
          location.replace("/");
          return;
        }
        const d = await r.json().catch(() => ({}));
        err.textContent = d.error || "確認に失敗しました";
      } catch (_) {
        err.textContent = "通信エラーが発生しました";
      }
      btn.disabled = false;
    });
  </script>
</body>
</html>
